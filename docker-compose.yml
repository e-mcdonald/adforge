version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      ENV: development
      # Ollama runs on the HOST machine, not in Docker
      # Mac/Windows: host.docker.internal:11434
      # Linux: 172.17.0.1:11434 (or use host-gateway below)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - campaign_images:/app/static/campaigns
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  campaign_images:
    driver: local
